name: Deploy to Environment

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Choose environment'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.env }}
    runs-on: ubuntu-latest

    env:
      ENV: ${{ github.event.inputs.env }}
      # HOST: ${{ github.event.inputs.env == 'staging' && secrets.STAGING_HOST || secrets.PRODUCTION_HOST }}
      GHCR_IMAGE: ghcr.io/cyfamod-technologies/ghcr-php:latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          # ENV is a workflow_dispatch "choice" input, so its actual value is
          # already constrained to staging/production - but the job-level
          # env: block above already resolves it to $ENV, so this remote
          # script reuses that instead of interpolating the raw input text a
          # second time. This script runs on a real server over SSH, not
          # just the CI runner, so it's worth being consistent here too.
          envs: ENV
          script: |
            export GHCR_IMAGE="ghcr.io/cyfamod-technologies/ghcr-php:latest"
            echo "Deploying to $ENV..."
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_TOKEN }}
            docker pull $GHCR_IMAGE
            docker stack deploy --with-registry-auth -c /home/ubuntu/env-deploy/docker-compose.${ENV}.yml env-deploy

